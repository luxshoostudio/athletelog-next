name: apply-pna
on:
  push:
    branches: [cursor/pna-origins-for-v1-b486]
    paths: [pna-all.patch]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/pna-origins-for-v1-b486
      - name: Apply the private-network origin change
        run: |
          set -euo pipefail
          if grep -q EXTRA_PNA_ORIGINS api/server.js; then
            echo already-applied
            exit 0
          fi
          git apply pna-all.patch
          git config user.name "luxshoostudio"
          git config user.email "279083974+luxshoostudio@users.noreply.github.com"
          git add .env.example api/server.js api/test/server-cors.test.js
          git rm -f pna-all.patch
          git commit -m "Let a named public origin reach a tailnet server."
          git push origin HEAD:cursor/pna-origins-for-v1-b486
