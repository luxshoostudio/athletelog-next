name: apply-existing-week
on:
  push:
    branches: [cursor/weekly-plan-existing-week-b486]
    paths:
      - .github/workflows/apply-existing-week.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/weekly-plan-existing-week-b486
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the weekly plan patch
        run: |
          set -euo pipefail
          if grep -q "function routineForWeekday" mcp/src/weekly-plan.js; then
            echo "already applied"
            exit 0
          fi
          curl -fsSL -o /tmp/plan.patch "https://raw.githubusercontent.com/luxshoostudio/athletelog/1b68fc532694909b33e2bda173f8572ee895b787/.github/weekly-plan-existing-week.patch"
          git apply /tmp/plan.patch
          git config user.name "luxshoostudio"
          git config user.email "279083974+luxshoostudio@users.noreply.github.com"
          git add mcp/README.md mcp/src/weekly-plan.js mcp/test/weekly-plan.test.js mcp/test/weekly-plan-disk.test.js
          git commit -m "Read and update the weekly plan routines already on the week."
          git push origin HEAD:cursor/weekly-plan-existing-week-b486
